<!DOCTYPE html>
<html lang="en">
<body style="margin: 0; background: #000; overflow: hidden;">
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 1500; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: 0,
                vy: 0,
                color: `hsl(${Math.random() * 40 + 180}, 100%, 50%)`
            });
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, w, h);

            particles.forEach(p => {
                // --- THE MATH WORLD SELECTOR ---
                
                // Formula A: The Silk (Main Project)
                let angle = (Math.sin(p.x * 0.01) + Math.cos(p.y * 0.01)) * 2;

                // Formula B: The Vortex (Uncomment to try)
                // let angle = Math.atan2(h/2 - p.y, w/2 - p.x) + Math.PI/2;

                //Formula C: The Turbulent Grid (Uncomment to try)
                //let angle = (Math.sin(p.x * 0.05) * Math.cos(p.y * 0.05)) * 10;

                // Formula C: The Magnetic Field (Uncomment to try)
                //let angle = Math.sin(p.x * p.y * 0.00001) * Math.PI;

                p.vx = Math.cos(angle) * 2;
                p.vy = Math.sin(angle) * 2;
                p.x += p.vx;
                p.y += p.vy;

                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 1, 1);

                if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
            });

            requestAnimationFrame(draw);
        }

        window.onresize = () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        };

        draw();
    </script>
</body>
</html>
